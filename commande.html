<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Commande | KASA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="announcement-bar">
        Livraison offerte dès 150 € · Retours sous 30 jours
    </div>

    <div id="site-header"></div>

    <main>

        <section class="checkout-page">

            <div class="checkout-header">
                <p class="section-eyebrow">FINALISER VOTRE COMMANDE</p>
                <h1>Commande</h1>
            </div>

            <div id="checkout-content">

    <div class="checkout-layout">

        <div class="checkout-form">

            <h2>Vos informations</h2>

            <div class="form-row">
                <div class="form-field">
                    <label for="first-name">Prénom <span class="required">*</span></label>
                    <input type="text" id="first-name" required>
                </div>

                <div class="form-field">
                    <label for="last-name">Nom <span class="required">*</span></label>
                    <input type="text" id="last-name" required>
                </div>
            </div>

            <div class="form-field">
                <label for="email">E-mail <span class="required">*</span></label>
                <input type="email" id="email" required>
            </div>

            <div class="form-field">
                <label for="address">Adresse <span class="required">*</span></label>
                <input type="text" id="address" required>
            </div>

            <div class="form-row">
                <div class="form-field">
                    <label for="postal-code">Code postal <span class="required">*</span></label>
                    <input type="text" id="postal-code" required>
                </div>

                <div class="form-field">
                    <label for="city">Ville <span class="required">*</span></label>
                    <input type="text" id="city" required>
                </div>
                <div class="payment-section">

    <h2>Paiement</h2>

    <div class="payment-method">
        <span>Paiement sécurisé par carte bancaire</span>
        <span class="payment-cards">VISA · Mastercard</span>
    </div>

    <div class="form-field">
        <label for="card-number">Numéro de carte <span class="required">*</span></label>
        <input type="text" id="card-number" placeholder="1234 5678 9012 3456">
    </div>

    <div class="form-row">
        <div class="form-field">
            <label for="card-expiry">Date d'expiration <span class="required">*</span></label>
            <input type="text" id="card-expiry" placeholder="MM / AA">
        </div>

        <div class="form-field">
            <label for="card-cvv">Cryptogramme <span class="required">*</span></label>
            <input type="text" id="card-cvv" placeholder="123">
        </div>
    </div>

</div>
            </div>

        <aside class="checkout-summary">

            <h2>Votre commande</h2>

            <div id="checkout-products">
                <!-- produits -->
            </div>

            <div class="checkout-total">
                <span>Total</span>
                <strong id="checkout-total-price">0 €</strong>
            </div>

            <button type="button" class="checkout-submit" id="confirm-order">
    Confirmer la commande
</button>
<p class="payment-security">
    Paiement sécurisé · Vos données bancaires ne sont pas conservées
</p>

        </aside>

    </div>

</div>

        </section>

    </main>

<script>

const cart = JSON.parse(localStorage.getItem('kasaCart')) || [];

const checkoutProducts = document.querySelector('#checkout-products');
const checkoutTotalPrice = document.querySelector('#checkout-total-price');

const total = cart.reduce((sum, product) => {
    return sum + (product.price * product.quantity);
}, 0);

checkoutProducts.innerHTML = cart.map(product => `
    <div class="checkout-product">

        <div>
            <strong>${product.name}</strong>
            <span>Quantité : ${product.quantity}</span>
        </div>

        <span>${product.price * product.quantity} €</span>

    </div>
`).join('');

checkoutTotalPrice.textContent = `${total} €`;

const confirmOrder = document.querySelector('#confirm-order');
const cardNumberField = document.querySelector('#card-number');

cardNumberField.addEventListener('input', () => {

    let value = cardNumberField.value.replace(/\D/g, '');

    value = value.substring(0, 16);

    value = value.replace(/(\d{4})(?=\d)/g, '$1 ');

    cardNumberField.value = value;

});
const cardExpiryField = document.querySelector('#card-expiry');

cardExpiryField.addEventListener('input', () => {

    let value = cardExpiryField.value.replace(/\D/g, '');

    value = value.substring(0, 4);

    if (value.length > 2) {
        value = value.substring(0, 2) + ' / ' + value.substring(2);
    }

    cardExpiryField.value = value;

});
const cardCvvField = document.querySelector('#card-cvv');

cardCvvField.addEventListener('input', () => {

    let value = cardCvvField.value.replace(/\D/g, '');

    value = value.substring(0, 3);

    cardCvvField.value = value;

});

const requiredFields = [
    document.querySelector('#first-name'),
    document.querySelector('#last-name'),
    document.querySelector('#email'),
    document.querySelector('#address'),
    document.querySelector('#postal-code'),
    document.querySelector('#city'),
    document.querySelector('#card-number'),
    document.querySelector('#card-expiry'),
    document.querySelector('#card-cvv')
];


// Supprimer l'erreur dès que l'utilisateur modifie le champ

requiredFields.forEach(field => {

    field.addEventListener('input', () => {

        field.classList.remove('input-error');

        const formField = field.closest('.form-field');

        if (formField) {
            formField.classList.remove('input-error');

            const errorMessage = formField.querySelector('.form-error');

            if (errorMessage) {
                errorMessage.remove();
            }
        }

    });

});


// Fonction pour afficher une erreur

function showError(field, message) {

    field.classList.add('input-error');

    const formField = field.closest('.form-field');

    formField.classList.add('input-error');

    if (!formField.querySelector('.form-error')) {

        const errorMessage = document.createElement('span');

        errorMessage.className = 'form-error';

        errorMessage.textContent = message;

        formField.appendChild(errorMessage);
    }
}


// Validation de la commande

confirmOrder.addEventListener('click', () => {

    let hasError = false;
    let firstError = null;


    // 1. Vérification des champs obligatoires

    requiredFields.forEach(field => {

        if (field.value.trim() === '') {

            showError(
                field,
                'Veuillez renseigner ce champ.'
            );

            hasError = true;

            if (!firstError) {
                firstError = field;
            }
        }

    });


    // 2. Vérification de l'e-mail

    const emailField = document.querySelector('#email');

    if (
        emailField.value.trim() !== '' &&
        !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailField.value.trim())
    ) {

        showError(
            emailField,
            'Veuillez saisir une adresse e-mail valide.'
        );

        hasError = true;

        if (!firstError) {
            firstError = emailField;
        }
    }


    // 3. Vérification du code postal

    const postalCodeField = document.querySelector('#postal-code');

    if (
        postalCodeField.value.trim() !== '' &&
        !/^\d{5}$/.test(postalCodeField.value.trim())
    ) {

        showError(
            postalCodeField,
            'Le code postal doit comporter 5 chiffres.'
        );

        hasError = true;

        if (!firstError) {
            firstError = postalCodeField;
        }
    }


    // 4. Vérification du numéro de carte

    const cardNumberField = document.querySelector('#card-number');

    const cardNumber = cardNumberField.value
        .replace(/\s/g, '');

    if (
        cardNumberField.value.trim() !== '' &&
        !/^\d{16}$/.test(cardNumber)
    ) {

        showError(
            cardNumberField,
            'Le numéro de carte doit comporter 16 chiffres.'
        );

        hasError = true;

        if (!firstError) {
            firstError = cardNumberField;
        }
    }


    // 5. Vérification de la date d'expiration

    const cardExpiryField = document.querySelector('#card-expiry');

    const expiryValue = cardExpiryField.value.trim();

if (expiryValue !== '') {

    const expiryMatch = expiryValue.match(
        /^(0[1-9]|1[0-2])\s?\/\s?(\d{2})$/
    );

    if (!expiryMatch) {

        showError(
            cardExpiryField,
            'Format attendu : MM / AA.'
        );

        hasError = true;

        if (!firstError) {
            firstError = cardExpiryField;
        }

    } else {

        const expiryMonth = parseInt(expiryMatch[1]);
        const expiryYear = 2000 + parseInt(expiryMatch[2]);

        const currentDate = new Date();

        const currentMonth = currentDate.getMonth() + 1;
        const currentYear = currentDate.getFullYear();

        if (
            expiryYear < currentYear ||
            (
                expiryYear === currentYear &&
                expiryMonth < currentMonth
            )
        ) {

            showError(
                cardExpiryField,
                'Cette carte est expirée.'
            );

            hasError = true;

            if (!firstError) {
                firstError = cardExpiryField;
            }
        }
    }
}


    // 6. Vérification du cryptogramme

    const cardCvvField = document.querySelector('#card-cvv');

    if (
        cardCvvField.value.trim() !== '' &&
        !/^\d{3}$/.test(cardCvvField.value.trim())
    ) {

        showError(
            cardCvvField,
            'Le cryptogramme doit comporter 3 chiffres.'
        );

        hasError = true;

        if (!firstError) {
            firstError = cardCvvField;
        }
    }


    // S'il y a une erreur, on reste sur la page

    if (hasError) {

        firstError.focus();

        return;
    }


    // Création du numéro de commande

    const orderNumber =
        `KASA-${Math.floor(100000 + Math.random() * 900000)}`;

    sessionStorage.setItem(
        'kasaOrderNumber',
        orderNumber
    );


    // Vider le panier

    localStorage.removeItem('kasaCart');


    // Aller vers la confirmation

    window.location.href = 'confirmation.html';

});

</script>
<div id="site-footer"></div>
<script src="js/products.js"></script>
<script src="js/components.js"></script>
</body>
</html>
