<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier | KASA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="announcement-bar">
        Livraison offerte dès 150 € · Retours sous 30 jours
    </div>

    <div id="site-header"></div>

    <main>

        <section class="cart-page">

            <div class="cart-header">
                <p class="section-eyebrow">VOTRE SÉLECTION</p>
                <h1>Panier</h1>
            </div>

            <div id="cart-content">
</div>

<script>
const cartContent = document.querySelector('#cart-content');

let cart = JSON.parse(localStorage.getItem('kasaCart')) || [];

function displayCart() {

    if (cart.length === 0) {

        cartContent.innerHTML = `
            <p>Votre panier est vide.</p>
        `;

        return;
    }

    const total = cart.reduce((sum, product) => {
        return sum + (product.price * product.quantity);
    }, 0);

    cartContent.innerHTML = `

        <div class="cart-layout">

            <div class="cart-items">

                ${cart.map(product => `
                    <div class="cart-item">

                        <img src="${product.image}" alt="${product.name}">

                        <div class="cart-item-info">
                            <h2>${product.name}</h2>
                            <p>${product.price} €</p>

                            <div class="cart-quantity">

                                <button type="button"
                                    class="cart-minus"
                                    data-name="${product.name}">
                                    −
                                </button>

                                <span>${product.quantity}</span>

                                <button type="button"
                                    class="cart-plus"
                                    data-name="${product.name}">
                                    +
                                </button>

                            </div>
                            <button type="button" class="remove-product" data-name="${product.name}">
    Supprimer
</button>

                        </div>

                    </div>
                `).join('')}

            </div>

            <aside class="cart-summary">

                <h2>Récapitulatif</h2>

                <div class="cart-summary-line">
                    <span>Sous-total</span>
                    <span>${total} €</span>
                </div>

                <div class="cart-summary-line">
                    <span>Livraison</span>
                    <span>Offerte</span>
                </div>

                <div class="cart-total">
                    <span>Total</span>
                    <strong>${total} €</strong>
                </div>

                <a href="commande.html" class="checkout-button">
    Passer la commande
</a>

            </aside>

        </div>
    `;

    document.querySelectorAll('.cart-minus').forEach(button => {

        button.addEventListener('click', () => {

            const product = cart.find(
                product => product.name === button.dataset.name
            );

            if (product.quantity > 1) {
                product.quantity--;
                saveCart();
            }

        });

    });

    document.querySelectorAll('.cart-plus').forEach(button => {

        button.addEventListener('click', () => {

            const product = cart.find(
                product => product.name === button.dataset.name
            );

            product.quantity++;
            saveCart();

        });

    });

    document.querySelectorAll('.remove-product').forEach(button => {

        button.addEventListener('click', () => {

            const product = cart.find(
                product => product.name === button.dataset.name
            );

            cart = cart.filter(p => p !== product);
            saveCart();

        });

    });

}

function saveCart() {
    localStorage.setItem('kasaCart', JSON.stringify(cart));
    displayCart();
}


displayCart();
</script>

        </section>

    </main>
    <div id="site-footer"></div>
    <script src="js/products.js"></script>
<script src="js/components.js"></script>
</body>
</html>
