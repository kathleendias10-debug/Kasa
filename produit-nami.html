<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table basse NAMI | KASA</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="announcement-bar">
        Livraison offerte dès 150 € · Retours sous 30 jours
    </div>

    <div id="site-header"></div>

    <main>

    <section class="product-page">

        <div class="product-breadcrumb">
            <a href="index.html">Accueil</a>
            <span>→</span>
            <a href="tables-basses.html">Tables basses</a>
            <span>→</span>
            <span>NAMI</span>
        </div>

        <div class="product-detail">

            <div class="product-gallery">

                <div class="product-main-image">
                    <img src="assets/images/produit-table-basse-nami.jpg" alt="Table basse NAMI en teck massif">
                </div>

            </div>

            <div class="product-details">

                <p class="section-eyebrow">TABLE BASSE</p>

                <h1>Table basse NAMI</h1>

                <p class="product-price">349 €</p>

                <p class="product-description">
                    Une table basse en teck massif aux lignes simples et chaleureuses.
                    Une pièce intemporelle pensée pour apporter caractère et naturel
                    à votre intérieur.
                </p>

                <div class="product-material">
                    <span>Matière</span>
                    <strong>Teck massif</strong>
                </div>

                <div class="product-purchase">

    <div class="quantity-selector">
        <button type="button" class="quantity-minus">−</button>
        <span class="quantity-value">1</span>
        <button type="button" class="quantity-plus">+</button>
    </div>

    <button class="add-to-cart">
        Ajouter au panier
    </button>

</div>

            </div>

        </div>

    </section>

</main>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/components.js"></script>

<script>

const quantityValue = document.querySelector('.quantity-value');
const quantityMinus = document.querySelector('.quantity-minus');
const quantityPlus = document.querySelector('.quantity-plus');
const addToCart = document.querySelector('.add-to-cart');

let quantity = 1;

quantityMinus.addEventListener('click', () => {

    if (quantity > 1) {

        quantity--;

        quantityValue.textContent = quantity;

    }

});

quantityPlus.addEventListener('click', () => {

    quantity++;

    quantityValue.textContent = quantity;

});

addToCart.addEventListener('click', () => {

    const product = {
        name: 'Table basse NAMI',
        price: 349,
        quantity: quantity,
        image: 'assets/images/produit-table-basse-nami.jpg'
    };

    let cart =
        JSON.parse(localStorage.getItem('kasaCart')) || [];

    const existingProduct = cart.find(
        product => product.name === 'Table basse NAMI'
    );

    if (existingProduct) {

        existingProduct.quantity += quantity;

    } else {

        cart.push(product);

    }

    localStorage.setItem(
        'kasaCart',
        JSON.stringify(cart)
    );

    updateCartCount();

    addToCart.textContent =
        'Ajouté au panier ✓';

    setTimeout(() => {

        addToCart.textContent =
            'Ajouter au panier';

    }, 2000);

});

</script>

</body>
</html>
